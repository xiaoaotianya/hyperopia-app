name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # 本地开发用的是公司内网 npm 镜像，lock 文件里的地址在 GitHub 上访问不到，统一换成官方源
      # 内网镜像给部分无作用域包生成的地址缺少 "/-/"（如 yallist/yallist-3.1.1.tgz），一并补上
      - run: |
          sed -i -E 's#https://depend\.iflytek\.com(:443)?/artifactory/api/npm/npm-repo/#https://registry.npmjs.org/#g' package-lock.json
          sed -i -E 's#"https://registry\.npmjs\.org/([a-z0-9._-]+)/(\1-[^/"]+\.tgz)"#"https://registry.npmjs.org/\1/-/\2"#g' package-lock.json
      # npm ci 在 Actions 上报 "Exit handler never called!"（npm 自身 bug）。
      # 失败时打印 npm 调试日志尾部便于排查，再退回到不依赖 lock 文件的 npm install。
      - name: Install dependencies
        run: |
          if ! npm ci --no-audit --no-fund; then
            echo "::warning::npm ci 失败，改用 npm install"
            tail -n 60 "$(ls -t ~/.npm/_logs/*-debug-0.log | head -n 1)" || true
            rm -rf node_modules package-lock.json
            npm install --no-audit --no-fund
          fi
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
